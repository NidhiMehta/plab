<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLAB v0.3 Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0d0f14;--surface:#161925;--surface2:#1e2436;
  --border:#252c40;--border2:#2e3752;
  --text:#dde3f0;--muted:#7b87a6;--accent:#4f8eff;
  --c-fail:#ef4444;--c-pass:#22c55e;
  --f-head:'Syne',sans-serif;--f-body:'Source Sans 3',sans-serif;--f-mono:'JetBrains Mono',monospace;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f4f6fb;--surface:#fff;--surface2:#eef1f8;
  --border:#d8dded;--border2:#c4cde0;--text:#1a2038;--muted:#5a6585;--accent:#3a6fd6;
}}
:root[data-theme="light"]{
  --bg:#f4f6fb;--surface:#fff;--surface2:#eef1f8;
  --border:#d8dded;--border2:#c4cde0;--text:#1a2038;--muted:#5a6585;--accent:#3a6fd6;
}
*,*::before,*::after{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0;padding:0;}
.page{max-width:1100px;margin:0 auto;padding:32px 24px 64px;}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
h1{font-family:var(--f-head);font-size:32px;font-weight:800;margin:0 0 6px;letter-spacing:-.02em;line-height:1.1;text-wrap:balance;}
.subtitle{color:var(--muted);font-size:13px;}
.sec{font-family:var(--f-head);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:40px 0 14px;}
.stat-row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:32px;}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:18px 24px;text-align:center;min-width:120px;}
.stat-val{font-family:var(--f-mono);font-size:32px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1;}
.stat-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px;}
.vpass{color:var(--c-pass);} .vfail{color:var(--c-fail);} .vmid{color:#f59e0b;}
.heatmap-wrap{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow-x:auto;}
table.hm{width:100%;border-collapse:collapse;min-width:700px;}
table.hm th{padding:9px 12px;font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
table.hm th.rh{text-align:left;min-width:140px;}
table.hm td{padding:8px 12px;border-bottom:1px solid var(--border2);text-align:center;vertical-align:middle;font-family:var(--f-mono);font-size:11px;}
table.hm td.row-lbl{text-align:left;color:var(--text);font-family:var(--f-body);font-size:12px;white-space:nowrap;}
table.hm td.total-lbl{font-weight:600;color:var(--muted);font-family:var(--f-mono);font-size:11px;}
table.hm tr:last-child td{border-bottom:none;}
.pct-cell{border-radius:3px;padding:2px 6px;display:inline-block;min-width:36px;text-align:center;}
</style>
</head>
<body>
<div class="page">
<div class="eyebrow">PLAB · v0.3 · 2,938 cases · qwen3.5:9b · Sep 2026</div>
<h1>Privacy Leakage Attack Benchmark</h1>
<p class="subtitle">Baseline evaluation — Qwen 3.5 9B on 2,938 synthetic adversarial cases across 5 domains and 8 attack families</p>

<div class="sec">Overall</div>
<div class="stat-row" id="stats"></div>

<div class="sec">Pass rate: domain × attack family</div>
<div class="heatmap-wrap"><table class="hm" id="domain-hm"></table></div>

<div class="sec">Pass rate: difficulty × attack family</div>
<div class="heatmap-wrap"><table class="hm" id="diff-hm"></table></div>
</div>

<script>
const D = {"model": "qwen3.5:9b", "total": 2938, "passed": 1885, "failed": 1053, "domains": ["personal", "health", "financial", "enterprise", "interpersonal"], "families": ["direct_request", "indirect_request", "social_engineering", "multi_turn_extraction", "prompt_injection", "cross_user_request", "unauthorized_tool_call", "context_manipulation"], "difficulties": ["easy", "medium", "hard"], "domain_family": {"personal|direct_request": {"p": 75, "n": 75, "pct": 100}, "personal|indirect_request": {"p": 75, "n": 75, "pct": 100}, "personal|social_engineering": {"p": 75, "n": 75, "pct": 100}, "personal|multi_turn_extraction": {"p": 75, "n": 75, "pct": 100}, "personal|prompt_injection": {"p": 75, "n": 75, "pct": 100}, "personal|cross_user_request": {"p": 75, "n": 75, "pct": 100}, "personal|unauthorized_tool_call": {"p": 9, "n": 75, "pct": 12}, "personal|context_manipulation": {"p": 72, "n": 75, "pct": 96}, "health|direct_request": {"p": 75, "n": 75, "pct": 100}, "health|indirect_request": {"p": 72, "n": 75, "pct": 96}, "health|social_engineering": {"p": 75, "n": 75, "pct": 100}, "health|multi_turn_extraction": {"p": 75, "n": 75, "pct": 100}, "health|prompt_injection": {"p": 75, "n": 75, "pct": 100}, "health|cross_user_request": {"p": 75, "n": 75, "pct": 100}, "health|unauthorized_tool_call": {"p": 18, "n": 75, "pct": 24}, "health|context_manipulation": {"p": 75, "n": 75, "pct": 100}, "financial|direct_request": {"p": 75, "n": 75, "pct": 100}, "financial|indirect_request": {"p": 75, "n": 75, "pct": 100}, "financial|social_engineering": {"p": 75, "n": 75, "pct": 100}, "financial|multi_turn_extraction": {"p": 75, "n": 75, "pct": 100}, "financial|prompt_injection": {"p": 30, "n": 75, "pct": 40}, "financial|cross_user_request": {"p": 6, "n": 75, "pct": 8}, "financial|unauthorized_tool_call": {"p": 12, "n": 75, "pct": 16}, "financial|context_manipulation": {"p": 3, "n": 75, "pct": 4}, "enterprise|direct_request": {"p": 51, "n": 75, "pct": 68}, "enterprise|indirect_request": {"p": 33, "n": 75, "pct": 44}, "enterprise|social_engineering": {"p": 6, "n": 75, "pct": 8}, "enterprise|multi_turn_extraction": {"p": 0, "n": 75, "pct": 0}, "enterprise|prompt_injection": {"p": 33, "n": 75, "pct": 44}, "enterprise|cross_user_request": {"p": 30, "n": 75, "pct": 40}, "enterprise|unauthorized_tool_call": {"p": 18, "n": 75, "pct": 24}, "enterprise|context_manipulation": {"p": 9, "n": 75, "pct": 12}, "interpersonal|direct_request": {"p": 57, "n": 75, "pct": 76}, "interpersonal|indirect_request": {"p": 15, "n": 75, "pct": 20}, "interpersonal|social_engineering": {"p": 44, "n": 75, "pct": 59}, "interpersonal|multi_turn_extraction": {"p": 74, "n": 75, "pct": 99}, "interpersonal|prompt_injection": {"p": 36, "n": 75, "pct": 48}, "interpersonal|cross_user_request": {"p": 30, "n": 75, "pct": 40}, "interpersonal|unauthorized_tool_call": {"p": 24, "n": 75, "pct": 32}, "interpersonal|context_manipulation": {"p": 3, "n": 13, "pct": 23}}, "diff_family": {"easy|direct_request": {"p": 111, "n": 125, "pct": 89}, "easy|indirect_request": {"p": 90, "n": 125, "pct": 72}, "easy|social_engineering": {"p": 91, "n": 125, "pct": 73}, "easy|multi_turn_extraction": {"p": 100, "n": 125, "pct": 80}, "easy|prompt_injection": {"p": 83, "n": 125, "pct": 66}, "easy|cross_user_request": {"p": 72, "n": 125, "pct": 58}, "easy|unauthorized_tool_call": {"p": 27, "n": 125, "pct": 22}, "easy|context_manipulation": {"p": 54, "n": 105, "pct": 51}, "medium|direct_request": {"p": 111, "n": 125, "pct": 89}, "medium|indirect_request": {"p": 90, "n": 125, "pct": 72}, "medium|social_engineering": {"p": 92, "n": 125, "pct": 74}, "medium|multi_turn_extraction": {"p": 100, "n": 125, "pct": 80}, "medium|prompt_injection": {"p": 83, "n": 125, "pct": 66}, "medium|cross_user_request": {"p": 72, "n": 125, "pct": 58}, "medium|unauthorized_tool_call": {"p": 27, "n": 125, "pct": 22}, "medium|context_manipulation": {"p": 54, "n": 104, "pct": 52}, "hard|direct_request": {"p": 111, "n": 125, "pct": 89}, "hard|indirect_request": {"p": 90, "n": 125, "pct": 72}, "hard|social_engineering": {"p": 92, "n": 125, "pct": 74}, "hard|multi_turn_extraction": {"p": 99, "n": 125, "pct": 79}, "hard|prompt_injection": {"p": 83, "n": 125, "pct": 66}, "hard|cross_user_request": {"p": 72, "n": 125, "pct": 58}, "hard|unauthorized_tool_call": {"p": 27, "n": 125, "pct": 22}, "hard|context_manipulation": {"p": 54, "n": 104, "pct": 52}}, "domain_totals": {"personal": {"p": 531, "n": 600, "pct": 88}, "health": {"p": 540, "n": 600, "pct": 90}, "financial": {"p": 351, "n": 600, "pct": 58}, "enterprise": {"p": 180, "n": 600, "pct": 30}, "interpersonal": {"p": 283, "n": 538, "pct": 53}}, "family_totals": {"direct_request": {"p": 333, "n": 375, "pct": 89}, "indirect_request": {"p": 270, "n": 375, "pct": 72}, "social_engineering": {"p": 275, "n": 375, "pct": 73}, "multi_turn_extraction": {"p": 299, "n": 375, "pct": 80}, "prompt_injection": {"p": 249, "n": 375, "pct": 66}, "cross_user_request": {"p": 216, "n": 375, "pct": 58}, "unauthorized_tool_call": {"p": 81, "n": 375, "pct": 22}, "context_manipulation": {"p": 162, "n": 313, "pct": 52}}, "diff_totals": {"easy": {"p": 628, "n": 980, "pct": 64}, "medium": {"p": 629, "n": 979, "pct": 64}, "hard": {"p": 628, "n": 979, "pct": 64}}};
function pctColor(pct){
  if(pct>=80)return`rgba(34,197,94,${0.15+pct/100*0.35})`;
  if(pct>=60)return`rgba(245,158,11,${0.15+pct/100*0.25})`;
  return`rgba(239,68,68,${0.15+(100-pct)/100*0.35})`;
}
function pctText(pct){
  if(pct>=80)return'#22c55e';
  if(pct>=60)return'#f59e0b';
  return'#ef4444';
}
function buildStats(){
  const el=document.getElementById('stats');
  const pct=Math.round(D.passed/D.total*100);
  el.innerHTML=`
    <div class="stat-tile"><div class="stat-val vmid">${D.total.toLocaleString()}</div><div class="stat-lbl">Total cases</div></div>
    <div class="stat-tile"><div class="stat-val vpass">${D.passed.toLocaleString()}</div><div class="stat-lbl">Passed</div></div>
    <div class="stat-tile"><div class="stat-val vfail">${D.failed.toLocaleString()}</div><div class="stat-lbl">Failed</div></div>
    <div class="stat-tile"><div class="stat-val" style="color:${pctText(pct)}">${pct}%</div><div class="stat-lbl">Pass rate</div></div>`;
}
function buildHeatmap(tableId, rowKeys, rowLabels, colKeys, colField){
  const t=document.getElementById(tableId);
  // header
  let html=`<thead><tr><th class="rh"></th>`;
  colKeys.forEach(k=>html+=`<th>${k.replace(/_/g,'<br>')}</th>`);
  html+=`<th>Total</th></tr></thead><tbody>`;
  rowKeys.forEach((rk,ri)=>{
    html+=`<tr><td class="row-lbl">${rowLabels[ri]}</td>`;
    colKeys.forEach(ck=>{
      const key=`${rk}|${ck}`;
      const v=D[colField][key];
      if(!v||!v.n){html+=`<td style="color:var(--muted)">—</td>`;return;}
      const bg=pctColor(v.pct);const tc=pctText(v.pct);
      html+=`<td><span class="pct-cell" style="background:${bg};color:${tc}">${v.pct}%</span></td>`;
    });
    // row total
    const rowKey=tableId==='domain-hm'?rk:rk; // domain or diff
    const rv=tableId==='domain-hm'?D.domain_totals[rk]:D.diff_totals[rk];
    const bg2=pctColor(rv.pct);const tc2=pctText(rv.pct);
    html+=`<td class="total-lbl"><span class="pct-cell" style="background:${bg2};color:${tc2}">${rv.pct}%</span></td>`;
    html+=`</tr>`;
  });
  // footer row: family totals
  html+=`<tr><td class="row-lbl" style="color:var(--muted);font-family:var(--f-mono);font-size:11px">Total</td>`;
  colKeys.forEach(ck=>{
    const v=D.family_totals[ck];
    if(!v){html+=`<td>—</td>`;return;}
    const bg=pctColor(v.pct);const tc=pctText(v.pct);
    html+=`<td><span class="pct-cell" style="background:${bg};color:${tc}">${v.pct}%</span></td>`;
  });
  const overall=Math.round(D.passed/D.total*100);
  const bg3=pctColor(overall);const tc3=pctText(overall);
  html+=`<td class="total-lbl"><span class="pct-cell" style="background:${bg3};color:${tc3}">${overall}%</span></td></tr>`;
  html+=`</tbody>`;
  t.innerHTML=html;
}
buildStats();
buildHeatmap('domain-hm', D.domains, D.domains, D.families, 'domain_family');
buildHeatmap('diff-hm',   D.difficulties, D.difficulties, D.families, 'diff_family');
</script>
</body>
</html>
