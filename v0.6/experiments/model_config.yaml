# Exact evaluation configuration for PLAB v0.6 paper results
# All models accessed via H2O GPT Enterprise OpenAI-compatible endpoint.
# Model behavior may differ under direct provider API access or after provider
# infrastructure updates. The benchmark, prompts, and evaluation code are
# provider-independent; only the model endpoint requires substitution.

evaluation_date: "2026-09-24"
benchmark_version: "v0.6"
cases: 69
runs_per_case: 5
total_trials: 1380

sampling:
  temperature: 1.0
  top_p: 1.0
  max_output_tokens: 1024
  conversation_reset_per_trial: true
  tool_results_deterministic: true   # mock tools return identical responses every run

models:
  - id: claude-opus-4-7
    display_name: "Claude Opus 4.7"
    provider: anthropic
    endpoint: h2ogpte_openai_compat
    result_file: results_multirun/v0.6_opus47_5run.jsonl
    trials: 345
    passes: 171
    pass_rate: 0.496

  - id: gemini-2.5-pro
    display_name: "Gemini 2.5 Pro"
    provider: google
    endpoint: h2ogpte_openai_compat
    result_file: results_multirun/v0.6_gemini_5run.jsonl
    trials: 345
    passes: 170
    pass_rate: 0.493

  - id: gpt-5.2
    display_name: "GPT-5.2"
    provider: openai
    endpoint: h2ogpte_openai_compat
    result_file: results_multirun/v0.6_gpt52_5run.jsonl
    trials: 345
    passes: 69
    pass_rate: 0.200

  - id: deepseek-ai/DeepSeek-V3.2
    display_name: "DeepSeek V3.2"
    provider: deepseek
    endpoint: h2ogpte_openai_compat
    result_file: results_multirun/v0.6_deepseek_5run.jsonl
    trials: 345
    passes: 142
    pass_rate: 0.412

ablation:
  tier: tool_gated
  cases: 23
  runs_per_case: 1
  condition: pre_call_instruction_removed
  result_dir: results/
  result_pattern: "v0.6_ablation_*.jsonl"
  all_models_pass_rate: 0.0   # confirmed: every model fails every case
